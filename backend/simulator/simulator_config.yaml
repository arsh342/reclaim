# Recovery Outcome Simulator — config
# Source of truth: docs/reclaim-build-plan.md §3
# All 5×5=25 action_fit cells are explicit so a misconfigured cell fails
# loudly at load time rather than silently defaulting to 1.0.

base_rate:
  insufficient_funds: 0.35
  issuer_timeout:     0.55
  card_blocked:       0.02
  invalid_card:       0.01
  network_error:      0.60

method_factor:
  card:       1.0
  upi:        1.15
  netbanking: 0.9

action_fit:
  insufficient_funds:
    retry_now:         0.3
    retry_delayed:     1.4
    payment_link:      1.1
    whatsapp_nudge:    1.0
    alternate_method:  0.8
  issuer_timeout:
    retry_now:         1.6
    retry_delayed:     1.0
    payment_link:      0.7
    whatsapp_nudge:    0.6
    alternate_method:  0.7
  card_blocked:
    retry_now:         0.0   # simulator agrees: retrying a blocked card never recovers
    retry_delayed:     0.0
    payment_link:      1.2
    whatsapp_nudge:    0.8
    alternate_method:  1.4
  invalid_card:
    retry_now:         0.0   # never — wrong card number
    retry_delayed:     0.0
    payment_link:      0.9
    whatsapp_nudge:    0.7
    alternate_method:  1.5
  network_error:
    retry_now:         1.5   # transient, immediate retry often works
    retry_delayed:     1.2
    payment_link:      0.8
    whatsapp_nudge:    0.7
    alternate_method:  0.8

# Multiplier for the concrete method selected when alternate_method wins.
# These are synthetic assumptions and are applied on top of action_fit.
alternate_method_fit:
  insufficient_funds:
    upi:           1.3
    another_card:  0.8
  issuer_timeout:
    upi:           1.1
    another_card:  0.9
  card_blocked:
    upi:           1.6
    another_card:  1.2
  invalid_card:
    upi:           2.5
    another_card:  0.8
  network_error:
    upi:           1.1
    another_card:  0.9

# Cells where a 0% recovery rate is the design, not a bug.
# The eyeball script uses this to distinguish intentional zeros from
# silent degeneracy. Listed as reason.action.
allowed_zero:
  - card_blocked.retry_now
  - card_blocked.retry_delayed
  - invalid_card.retry_now
  - invalid_card.retry_delayed

# Customer factor formula: factor = clip(0.5 + propensity, 0.5, 1.5)
# propensity range documented here so the formula and the database column agree.
customer_factor:
  shape: linear_centered
  intercept: 0.5
  slope: 1.0
  min: 0.5
  max: 1.5

# Probability clip applied to the final product, before sampling.
# 0.95 = a tiny floor of uncertainty kept on every cell, even if the
# formula would give 1.0.
clip:
  min: 0.0
  max: 0.95
