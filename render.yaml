services:
  - type: web
    name: reclaim-api
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=. uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reclaim-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://reclaim-frontend.onrender.com

  - type: web
    name: reclaim-frontend
    env: node
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start -- --port $PORT"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://reclaim-api.onrender.com

databases:
  - name: reclaim-db
    databaseName: reclaim
    user: reclaim
    plan: free