version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reclaim
      POSTGRES_PASSWORD: reclaim
      POSTGRES_DB: reclaim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reclaim -d reclaim"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: